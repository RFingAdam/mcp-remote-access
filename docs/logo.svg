<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="RFingAdam Security Research">
  <title>RFingAdam — Security Research</title>
  <!-- Icon: RF broadcast inside a shield -->
  <g fill="none" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round">
    <!-- shield -->
    <path d="M32 6 L52 14 V32 C52 45 43 53 32 58 C21 53 12 45 12 32 V14 Z"
          stroke="#38bdf8" stroke-width="3" fill="#0ea5e922"/>
    <!-- broadcast waves -->
    <circle cx="32" cy="32" r="3.2" fill="#0ea5e9" stroke="none"/>
    <path d="M25 32 a9 9 0 0 1 14 0" />
    <path d="M21 32 a13.5 13.5 0 0 1 22 0" stroke="#7dd3fc"/>
  </g>
  <!-- Wordmark -->
  <text x="66" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">
    <tspan fill="#0ea5e9">RFing</tspan><tspan fill="#64748b">Adam</tspan>
  </text>
  <text x="67" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5"
        font-weight="600" letter-spacing="3.4" fill="#64748b">SECURITY RESEARCH</text>
</svg>
