<?xml version="1.0" encoding="UTF-8"?>
<!--
  mcp-remote-access · brand banner
  Built from eng-mcp-suite/docs/brand/logo-template.svg.
  Glyph: g-terminal. Accent: ink-muted (#94A3B8) — soft / infrastructure tone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320"
     role="img" aria-label="mcp-remote-access — SSH and serial-port control for embedded devices over MCP">
  <title>mcp-remote-access — SSH and serial-port control for embedded devices over MCP</title>

  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0B1220"/>
      <stop offset="50%"  stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <filter id="t-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .accent        { color: #94A3B8; }
      .accent-stroke { stroke: #94A3B8; }
      .accent-fill   { fill:   #94A3B8; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#t-bg)"/>

  <g stroke="#1E293B" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="40"  x2="1280" y2="40"/>
    <line x1="0" y1="80"  x2="1280" y2="80"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
  </g>

  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="240" height="240" rx="44" ry="44"
          fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
    <rect x="12" y="12" width="216" height="216" rx="34" ry="34"
          fill="none" stroke="#1E293B" stroke-width="1" opacity="0.7"/>

    <!-- Inlined g-terminal glyph -->
    <g id="glyph-slot" transform="translate(40, 40)" filter="url(#t-glow)">
      <g fill="none" class="accent-stroke" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="16" y="32" width="128" height="96" rx="6" stroke-opacity="0.8"/>
        <line x1="16" y1="50" x2="144" y2="50" stroke-opacity="0.5"/>
        <circle cx="28" cy="41" r="3" stroke-opacity="0.6"/>
        <circle cx="40" cy="41" r="3" stroke-opacity="0.6"/>
        <circle cx="52" cy="41" r="3" stroke-opacity="0.6"/>
        <path d="M 32 78 L 44 86 L 32 94"/>
        <line x1="52" y1="94" x2="92" y2="94"/>
        <rect x="32" y="106" width="12" height="14" stroke-opacity="0.85"/>
      </g>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <text x="320" y="170" font-size="80" font-weight="800"
          fill="#F8FAFC" letter-spacing="-3">mcp-remote-access</text>

    <g id="version-pill" transform="translate(320, 188)">
      <rect x="0" y="0" width="58" height="30" rx="15"
            fill="#0F172A" class="accent-stroke" stroke-width="1.5"/>
      <text x="29" y="20" font-size="14" font-weight="700"
            class="accent-fill" text-anchor="middle">v0.1.0</text>
    </g>

    <text x="386" y="208" font-size="22" font-weight="500" fill="#94A3B8">
      SSH + serial-port control for embedded devices over MCP
    </text>

    <g font-size="14" font-weight="600" fill="#64748B">
      <text x="320" y="240">ssh · sftp · uart · paramiko · pyserial · vid/pid match · ai-pi-pilot</text>
    </g>

    <g transform="translate(320, 256)" font-size="13" font-weight="700">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="62" height="22" rx="11" fill="#1E293B"/>
        <text x="31" y="15" fill="#F59E0B" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(72, 0)">
        <rect x="0" y="0" width="44" height="22" rx="11" fill="#1E293B"/>
        <text x="22" y="15" fill="#22D3EE" text-anchor="middle">CLI</text>
      </g>
      <g transform="translate(126, 0)">
        <rect x="0" y="0" width="50" height="22" rx="11" fill="#1E293B"/>
        <text x="25" y="15" fill="#A78BFA" text-anchor="middle">MCP</text>
      </g>
      <g transform="translate(186, 0)">
        <rect x="0" y="0" width="78" height="22" rx="11" fill="#1E293B"/>
        <text x="39" y="15" fill="#34D399" text-anchor="middle">Apache-2.0</text>
      </g>
    </g>
  </g>
</svg>
